name: CI

# テストとビルドが通らない変更を main に入れないための検査。
# 必須チェック（ブランチ保護）に使う名前は、この job の name「test-build」で固定する。変えるとルールが効かなくなる。
#
# 注意：既存の fetch-daily.yml は GITHUB_TOKEN で main へ push する。GitHub の仕様で、GITHUB_TOKEN による push は
# 他のワークフローを起動しない。そのため bot の自動取得 commit ではこの CI は動かない（Pages のビルドだけが走る）。
# この CI が動くのは、人の push と pull request。
#
# 公開鍵（SERIES_APPROVER_PUBLIC_KEY）は秘密ではないので、Secrets ではなく Variables（vars）に置く。
# 秘密鍵はこのワークフローにも、リポジトリのどこにも置かない。公開鍵は第2回（署名方式）の検証に使う。
# 第3回以降は承認記録方式（docs/SERIES_PUBLISHING.md）で、運営者の端末操作は要らない。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: test-build
    runs-on: ubuntu-latest
    env:
      SERIES_APPROVER_PUBLIC_KEY: ${{ vars.SERIES_APPROVER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npm test

      # 連載の公開状態（scheduled / published）の回が、有効な承認（第2回は署名、第3回以降は承認記録）を持つことを確かめる。
      # 公開鍵が無い・承認が崩れている・公開済みの回が書き換えられている場合は、ここで失敗する。
      - name: Verify series approvals
        run: node scripts/series-tool.js check --strict

      - run: npm run build
